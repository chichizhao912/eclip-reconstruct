[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eclip-reconstruct"
version = "0.1.0"
description = "Replicate-supervised eCLIP coverage reconstruction and background-calibrated candidate calling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.10,<2",
  "torch>=2.1,<3",
  "pyBigWig>=0.3.22",
  "pysam>=0.22",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
eclip-reconstruct = "eclip_reconstruct.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

